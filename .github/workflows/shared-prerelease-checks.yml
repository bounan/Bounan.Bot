name: Shared Prerelease Checks

on:
  workflow_call:
    inputs:
      force:
        description: Run checks even when no build inputs changed
        type: boolean
        default: false
    outputs:
      code-changed:
        description: Whether build, runtime, or test inputs changed
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Build Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ inputs.force || steps.filter.outputs.code == 'true' }}

    steps:
      - name: Check out repository for push comparison
        if: ${{ !inputs.force && github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect build input changes
        if: ${{ !inputs.force }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            code:
              - 'packages/**'
              - 'third-party/common'
              - '.gitmodules'
              - 'scripts/**'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '**/tsconfig*.json'
              - 'biome.json*'
              - 'vitest.config.*'
              - 'knip.json'

  prerelease-checks:
    name: Prerelease Checks
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports:
          - 8001:8000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Perform prerelease checks
        run: pnpm run prerelease
