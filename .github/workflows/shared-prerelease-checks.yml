name: Shared Prerelease Checks

on:
  workflow_call:
    inputs:
      force:
        description: Run checks even when no build inputs changed
        type: boolean
        default: false
    outputs:
      code-changed:
        description: Whether build, runtime, or test inputs changed
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Build Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ inputs.force || steps.filter.outputs.code == 'true' }}

    steps:
      - name: Check out repository for push comparison
        if: ${{ !inputs.force && github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect build input changes
        if: ${{ !inputs.force }}
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: ${{ github.ref }}
          filters: |
            code:
              - 'packages/**'
              - 'third-party/common'
              - '.gitmodules'
              - 'scripts/**'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '**/tsconfig*.json'
              - 'eslint.config.*'
              - 'vitest.config.*'
              - 'knip.json'

  prerelease-checks:
    name: Prerelease Checks
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest@sha256:d89f8fcc6b1a39cb35976c248ed42a28c66ae00dc043099210f5571e42648ab4
        ports:
          - 8001:8000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Perform prerelease checks
        run: pnpm run prerelease
